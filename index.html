<body>
  <div id="root"></div>
  <script>
    (function () {
      var resetKey = "tovuq-dev-cache-reset-20260623-1";
      var isDevServer = location.port === "5174" || location.hostname === "localhost" || location.hostname === "127.0.0.1";

      if (!isDevServer || sessionStorage.getItem(resetKey)) return;

      sessionStorage.setItem(resetKey, "1");

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations()
          .then(function (registrations) {
            return Promise.all(registrations.map(function (registration) {
              return registration.unregister();
            }));
          })
          .then(function () {
            if (!("caches" in window)) return;
            return caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (key) {
                return caches.delete(key);
              }));
            });
          })
          .then(function () {
            location.reload();
          })
          .catch(function () {
            location.reload();
          });
      }
    })();
  </script>
  <script type="module" src="/src/main.jsx?v=20260623-1"></script>
</body>

</html>
